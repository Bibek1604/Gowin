async function ensureCategories() {
  log('Checking categories…', 'info');
  const { data: existing, error } = await supabase.from('categories').select('id,name');
  if (error) throw error;
  const map = {};
  (existing || []).forEach(c => { map[c.name] = c.id; });

  const missing = CATEGORIES.filter(c => !map[c.name]);
  if (missing.length) {
    const { data: inserted, error: insErr } = await supabase.from('categories').insert(missing).select();
    if (insErr) throw insErr;
    inserted.forEach(c => { map[c.name] = c.id; });
    log(`Created ${inserted.length} new categories.`, 'ok');
  } else {
    log('All categories already exist.', 'ok');
  }
  return map;
}

async function seedDestinations(list, destinationType, categoryMap) {
  log(`\nSeeding ${destinationType} destinations…`, 'info');
  const { data: existingPackages, error } = await supabase.from('tour_packages').select('title');
  if (error) throw error;
  const existingTitles = new Set((existingPackages || []).map(p => p.title.trim().toLowerCase()));

  let created = 0, skipped = 0;
  for (const dest of list) {
    if (existingTitles.has(dest.title.trim().toLowerCase())) {
      log(`  skip (exists): ${dest.title}`, 'info');
      skipped++;
      continue;
    }
    const categoryId = categoryMap[dest.category];
    const { error: insErr } = await supabase.from('tour_packages').insert([{
      title: dest.title,
      description: dest.description,
      price: dest.price,
      location: dest.location,
      duration: dest.duration,
      category_id: categoryId || null,
      destination_type: destinationType,
      images: [dest.image],
      available_dates: [],
    }]);
    if (insErr) {
      log(`  FAILED: ${dest.title} — ${insErr.message}`, 'err');
    } else {
      log(`  + ${dest.title}`, 'ok');
      created++;
    }
  }
  log(`${destinationType}: ${created} created, ${skipped} skipped.`, 'info');
}

document.getElementById('runBtn').addEventListener('click', async () => {
  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  logEl.innerHTML = '';
  try {
    const categoryMap = await ensureCategories();
    await seedDestinations(NEPAL, 'National', categoryMap);
    await seedDestinations(INTERNATIONAL, 'International', categoryMap);
    log('\nDone! Refresh the admin Manage Destinations page to see everything.', 'ok');
  } catch (e) {
    log('\nFATAL ERROR: ' + (e.message || e), 'err');
    console.error(e);
  } finally {
    btn.disabled = false;
  }
});
